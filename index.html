<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajan Jain Portfolio</title>
<link href="https://www.linkedin.com/in/rajan-jain-b55457289/" rel="stylesheet">
<!-- Font Awesome for Social Icons -->
<link rel="stylesheet" href="https://www.youtube.com/@rajan-jain-001">

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body{ min-height:100vh; overflow-x:hidden; background: #000; }

.container{
    min-height:100vh;
    display:grid;
    grid-template-columns:40% 60%;
    background:url("images/bg.jpg") center/cover no-repeat fixed;
}

.left{
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border-right:1px solid rgba(255,255,255,0.2);
    color:white;
}

.logo{ font-weight:700; letter-spacing:2px; margin-bottom:40px; }
.left h1{ font-size:64px; line-height:64px; margin-bottom:20px; }
.left p{ opacity:0.9; margin-bottom:30px; max-width:400px; }

/* SOCIAL ICONS */
.social-icons { display: flex; gap: 20px; margin-bottom: 30px; }
.social-icons a { color: white; font-size: 24px; transition: 0.3s; opacity: 0.7; }
.social-icons a:hover { opacity: 1; transform: translateY(-3px); }

.btn{
    background:transparent;
    border:1px solid white;
    color:white;
    padding:12px 25px;
    width:200px;
    cursor:pointer;
    transition:0.3s;
    text-decoration: none;
    display: inline-block;
    text-align: center;
}
.btn:hover{ background:white; color:black; }

.right{ position:relative; }
.menu{ position:absolute; top:30px; right:30px; font-size:28px; color:white; cursor:pointer; }
.scroll{ position:absolute; bottom:25px; left:50%; transform:translateX(-50%); font-size:28px; color:white; animation:float 2s infinite; }

@keyframes float{ 0%{transform:translate(-50%,0)} 50%{transform:translate(-50%,12px)} 100%{transform:translate(-50%,0)} }

@media(max-width:900px){
    .container{ grid-template-columns:1fr; }
    .left{ height: 100vh; width: 100%; text-align:center; align-items:center; padding:40px 25px; background: rgba(0,0,0,0.5);}
    .left h1{ font-size:48px; line-height:48px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="left">
        <div class="logo">RAJAN JAIN</div>
        <h1>FLIGHT<br>DESIGN</h1>
        <p>Aerospace Engineering student specializing in UAV design, pulsejet engines, and flight experimentation.</p>
        
        <!-- Social Icons Section -->
        <div class="social-icons">
            <a href="https://linkedin.com/in/YOUR_USERNAME" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="mailto:your-email@example.com"><i class="fas fa-envelope"></i></a>
            <a href="https://youtube.com/YOUR_CHANNEL" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://instagram.com/YOUR_USERNAME" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>

        <a href="projects.html" class="btn">Explore Projects →</a>
    </div>
    <div class="right">
        <div class="menu">☰</div>
        <div class="scroll">⌄</div>
    </div>
</div>
</body>
</html>
