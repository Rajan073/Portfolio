<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajan Jain Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
overflow-x:hidden;
}

/* MAIN CONTAINER */
.container{
min-height:100vh;
display:grid;
grid-template-columns:40% 60%;
/* PATH UPDATED: Now looks inside the 'images' folder */
background:url("images/bg.jpg") center/cover no-repeat;
background-attachment: fixed; /* Keeps background still while scrolling */
}

/* LEFT PANEL */
.left{
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
border-right:1px solid rgba(255,255,255,0.2);
box-shadow:0 0 40px rgba(0,0,0,0.35);
color:white;
border-radius:0 25px 25px 0;
}

.logo{
font-weight:700;
letter-spacing:2px;
margin-bottom:40px;
}

.left h1{
font-size:64px;
line-height:64px;
margin-bottom:20px;
}

.left p{
opacity:0.9;
margin-bottom:30px;
max-width:400px;
}

.btn{
background:transparent;
border:1px solid white;
color:white;
padding:12px 25px;
width:200px;
cursor:pointer;
transition:0.3s;
text-decoration: none;
display: inline-block;
text-align: center;
}

.btn:hover{
background:white;
color:black;
}

/* RIGHT SIDE */
.right{
position:relative;
}

.menu{
position:absolute;
top:30px;
right:30px;
font-size:28px;
color:white;
cursor:pointer;
}

.scroll{
position:absolute;
bottom:25px;
left:50%;
transform:translateX(-50%);
font-size:28px;
color:white;
animation:float 2s infinite;
}

@keyframes float{
0%{transform:translate(-50%,0)}
50%{transform:translate(-50%,12px)}
100%{transform:translate(-50%,0)}
}

/* TABLET */
@media(max-width:900px){
.container{
grid-template-columns:1fr;
}
.left{
border-radius:0;
text-align:center;
align-items:center;
padding:40px 25px;
height: 100vh;
background: rgba(0,0,0,0.4); /* Darker overlay for mobile readability */
}
.left h1{
font-size:48px;
line-height:48px;
}
}

/* MOBILE */
@media(max-width:500px){
.left h1{
font-size:36px;
line-height:38px;
}
.left p{
font-size:14px;
}
.btn{
width:160px;
padding:10px 18px;
}
.logo{
margin-bottom:25px;
}
}
</style>
</head>

<body>
<div class="container">
    <div class="left">
        <div class="logo">RAJAN JAIN</div>
        <h1>FLIGHT<br>DESIGN</h1>
        <p>This portfolio showcases my aerospace engineering projects including UAV design, pulsejet engines, structural analysis, rocket testing and flight experimentation.</p>
        <a href="#" class="btn">Explore Projects →</a>
    </div>
    <div class="right">
        <div class="menu">☰</div>
        <div class="scroll">⌄</div>
    </div>
</div>
</body>
</html>
